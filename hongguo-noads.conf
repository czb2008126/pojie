# 红果短剧 7.3.2 去广告规则（Quantumult X）
# 分析对象：红果短剧-7.3.2.ipa，主程序 Eggplant（com.phoenix.video）
# 使用方式：将 [filter_local]、[rewrite_local]、[mitm] 三段合并到 Quantumult X 配置。
# 说明：
#   1. 整域阻断的是广告专用域名，不会影响正文、阅读、账号等核心接口。
#   2. 部分广告接口与业务共用域名，只阻断广告路径，不整域拦截。
#   3. 激励广告的“任务状态/发奖”接口在 api5-normal-sinfonlinea.fqnovel.com，
#      与正文业务同域，无法靠域名规则单独屏蔽，需要脚本层处理。

[filter_local]
# 穿山甲/巨量广告投放与预加载
host-suffix, ad.zijieapi.com, reject
host-suffix, ads.zijieapi.com, reject
host-suffix, ads3-normal.zijieapi.com, reject
host-suffix, ads3-normal-lf.zijieapi.com, reject
host-suffix, ads3-normal-hl.zijieapi.com, reject
host-suffix, ads3-normal-lq.zijieapi.com, reject
host-suffix, ads5-normal.zijieapi.com, reject
host-suffix, ads5-normal-lf.zijieapi.com, reject
host-suffix, ads5-normal-hl.zijieapi.com, reject
host-suffix, ads5-normal-lq.zijieapi.com, reject
host-suffix, lianmengapi.snssdk.com, reject
host-suffix, stream.feedcoopapi.com, reject

# 广告体验页与巨量广告投放域
host-suffix, ad-experience.bytedance.com, reject
host-suffix, ad.oceanengine.com, reject

# 如希望顺带关闭广告/业务埋点，可取消下面注释
# host-suffix, mon.zijieapi.com, reject
# host-suffix, report.snssdk.com, reject
# host-suffix, log.zijieapi.com, reject
# host-suffix, applog.zijieapi.com, reject
# host-suffix, rtlog.zijieapi.com, reject
# host-suffix, rtapplog.zijieapi.com, reject

# 激进模式：广告 SDK 备选域名，未发现正文路径，但暂未完全确认
# host-suffix, id.snssdk.com, reject
# host-suffix, ie.snssdk.com, reject
# host-suffix, iu.snssdk.com, reject

# 广告落地页/线索页，按需启用
# host-suffix, leads.oceanengine.com, reject
# host-suffix, clue.oceanengine.com, reject
# host-suffix, brand.oceanengine.com, reject

[rewrite_local]
# ad.zijieapi.com 广告请求（整域分流已拦，这里兜底处理 http/https）
^https?://ad\.zijieapi\.com/api/ad/.+ url reject-200
^https?://ad\.zijieapi\.com/api/incentive/.+ url reject-200

# 穿山甲 SDK 初始化与预加载（ib/i 域名同时承载正常业务，只拦广告路径）
^https?://ib\.snssdk\.com/(api/ad/preload_ad/v3/|client_auth/js_sdk/config/v1/|inspect/intercept/) url reject-200
^https?://i\.snssdk\.com/(client_auth/js_sdk/config/v1/|service/settings/v3/) url reject-200

# ma.zijieapi.com 与业务混用的推广/广告接口（优惠券接口属于营销推广，可自行去掉）
^https?://ma\.zijieapi\.com/(api/apps/v1/ad/|api/apps/v1/capacity/get_csj_rit/|mgplatform/api/apps/ad/|mgplatform/api/promotion/|api/promotion/v1/coupon/) url reject-200

# 广告报告、反感反馈与归因
^https?://aweme\.snssdk\.com/falcon/fe_douyin_ad_react/.+ url reject-200
^https?://aweme\.snssdk\.com/ad/mission/.+ url reject-200
^https?://report\.snssdk\.com/aweme/track/report url reject-200
^https?://zlink\.ugsdk\.cn/ad/impression/asa/token url reject-200

# bytegecko 是通用 Lynx/H5 资源 CDN，只拦明确属于广告的素材/页面
^https?://[^/]+\.bytegecko\.com/obj/[^/]+/gecko/resource/(ad_report|ad_feedback)/.+ url reject-200
^https?://[^/]+\.bytegecko\.com/obj/ugflow-resource/.*/(reward_ad|welfare_ad_reward) url reject-200
^https?://[^/]+\.bytegecko\.com/obj/byte-gurd-source/incentive/.+ url reject-200

[mitm]
hostname = ad.zijieapi.com, ads3-normal.zijieapi.com, ads3-normal-lf.zijieapi.com, ads3-normal-hl.zijieapi.com, ads3-normal-lq.zijieapi.com, ads5-normal.zijieapi.com, ads5-normal-lf.zijieapi.com, ads5-normal-hl.zijieapi.com, ads5-normal-lq.zijieapi.com, i.snssdk.com, ib.snssdk.com, ma.zijieapi.com, aweme.snssdk.com, report.snssdk.com, zlink.ugsdk.cn, *.bytegecko.com
