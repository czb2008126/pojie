[server_local]
# 百度网盘去广告规则 - Quantumult X 完整配置文件片段
# 生成时间: 2026

[filter_local]
# 屏蔽百度网盘广告域名
HOST, duapp.com, reject
HOST,ablyun.com, reject
HOST-SUFFIX, baiduad.com.cn, reject

[rewrite_local]
# 1. 拦截百度网盘开屏广告、闪屏接口
^https?:\/\/pan\.baidu\.com\/api\/(init|ad|strategy|splash|recommend) reject
^https?:\/\/gdown\.baidu\.com\/.*(ad|recommend|splash) reject
^https?:\/\/tieba\.baidu\.com\/c\/s\/sync.*type=ad reject

# 2. 拦截闪屏图片/视频下发及运营活动弹窗
^https?:\/\/f3\.baidu\.com\/.*\.(jpg|png|gif|mp4) reject
^https?:\/\/pcs\.baidu\.com\/rest\/2\.0\/pcs\/file\?.*method=locate.*ad=1 reject

# 3. 屏蔽广告数据上报与埋点 (可选，防止行为追踪)
^https?:\/\/hm\.baidu\.com\/h\.js reject
^https?:\/\/sendLog\.baidu\.com\/.* reject

[mitm]
# 必须开启 MitM 并信任证书
hostname = pan.baidu.com, gdown.baidu.com, tieba.baidu.com, f3.baidu.com, hm.baidu.com, sendLog.baidu.com
